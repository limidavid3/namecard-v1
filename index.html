<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="名片夾">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>名片夾</title>
<style>
:root{
  --bg:#f4f2ed; --surface:#ffffff; --surface2:#faf9f6; --ink:#1c1b19; --muted:#77726a;
  --line:#e5e1d8; --accent:#0d6b5b; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --danger:#c0392b; --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.07);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111110;--surface:#1c1c1b;--surface2:#242422;--ink:#f1efe9;--muted:#9c978e;
  --line:#2f2e2b;--accent:#45c3a7;--accent-ink:#05251e;--accent-soft:#16372f;--danger:#ff6b5e;
  --shadow:0 1px 2px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* views */
.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  visibility:hidden;opacity:0;transform:translateX(18px);
  transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
.view.active{visibility:visible;opacity:1;transform:none;transition:opacity .18s ease,transform .18s ease}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* list header */
.top{padding:calc(var(--st) + 10px) 16px 10px;background:var(--bg)}
.top-row{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top h1{font-size:30px;font-weight:750;letter-spacing:.5px;margin:0}
.count{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.icon-btn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--accent)}
.icon-btn:active{background:var(--accent-soft)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:0 10px;height:44px;margin-top:6px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{width:28px;height:28px;border-radius:14px;display:grid;place-items:center}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin-top:12px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.crumb{display:flex;align-items:center;gap:10px;padding:2px 16px 8px}
.crumb button{color:var(--accent);font-weight:600;font-size:15px;padding:6px 0}
.crumb span{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.list{padding:4px 12px calc(var(--sb) + 110px)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.row:active{transform:scale(.985)}
.thumb{width:72px;height:44px;border-radius:5px;background:var(--surface2);flex:none;overflow:hidden;
  box-shadow:0 0 0 1px var(--line), 0 2px 5px rgba(0,0,0,.10);display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-name{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-name small{font-weight:500;font-size:13.5px;color:var(--muted);margin-left:6px}
.row-sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);opacity:.6}
.group .avatar{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.badge{min-width:28px;height:24px;padding:0 8px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);
  font-size:13px;font-weight:600;display:grid;place-items:center;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:70px 24px}
.empty .big{width:120px;height:74px;margin:0 auto 18px;border-radius:9px;border:2px dashed var(--line);display:grid;place-items:center}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 22px);
  display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);
  height:54px;padding:0 24px;border-radius:27px;font-weight:700;font-size:16px;
  box-shadow:0 8px 24px rgba(13,107,91,.35),0 2px 6px rgba(0,0,0,.15)}
.fab:active{transform:translateX(-50%) scale(.96)}

.hint{margin:4px 12px 10px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;
  font-size:14px;display:flex;gap:10px;align-items:flex-start}
.hint button{color:var(--accent);font-weight:700;margin-left:auto;padding:0 2px}

/* bars */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(var(--st) + 6px) 8px 6px;min-height:calc(var(--st) + 50px);background:var(--bg);border-bottom:1px solid var(--line)}
.bar button{color:var(--accent);font-size:17px;padding:8px 10px;border-radius:8px;min-width:60px}
.bar button.strong{font-weight:700}
.bar button:disabled{opacity:.4}
.bar .back{text-align:left;display:flex;align-items:center;gap:2px}
.bar-title{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .right{text-align:right}

/* detail */
.d-wrap{padding:16px 16px calc(var(--sb) + 40px)}
.d-photo{border-radius:12px;overflow:hidden;background:var(--surface2);box-shadow:var(--shadow);aspect-ratio:1.66;display:grid;place-items:center;color:var(--muted)}
.d-photo img{width:100%;height:100%;object-fit:contain;display:block;background:#0003}
.d-head{text-align:center;padding:18px 8px 6px}
.d-head h2{margin:0;font-size:26px;font-weight:750}
.d-head .t{color:var(--muted);margin-top:2px}
.d-head .co{display:inline-flex;align-items:center;gap:2px;margin-top:6px;color:var(--accent);font-weight:600;font-size:16px}
.quick{display:flex;justify-content:center;gap:12px;margin:14px 0 18px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;padding:10px 0;border-radius:12px;
  background:var(--surface);color:var(--accent);text-decoration:none;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.group-box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.kv{display:block;padding:10px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.kv:first-child{border-top:0}
.kv .k{font-size:13px;color:var(--muted)}
.kv .v{font-size:16.5px;word-break:break-word;white-space:pre-wrap}
a.kv .v{color:var(--accent)}
.meta{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;
  background:var(--surface);box-shadow:var(--shadow);font-weight:600;color:var(--accent);margin-bottom:10px}
.btn.danger{color:var(--danger)}

/* edit */
.e-wrap{padding:14px 16px calc(var(--sb) + 60px)}
.photo{position:relative;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px dashed var(--line);
  aspect-ratio:1.66;display:grid;place-items:center;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.tools{display:flex;gap:6px;margin:10px 0 4px}
.tools button{flex:1;height:54px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);
  font-size:12.5px;font-weight:600;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tools button:disabled{opacity:.4}
.tools button.icon-only{flex:0 0 48px;color:var(--danger)}
.sides{margin:0 0 10px}
.photo.empty{cursor:pointer}
.photo .add{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:15px}
.photo .add svg.i{width:34px;height:34px}
.d-sides{display:flex;justify-content:center}
.d-sides .seg{width:200px;margin-top:10px}
.raw-side{width:100%;font-size:12.5px;font-weight:700;color:var(--muted);margin:4px 2px 0}
.tools svg.i{width:18px;height:18px}
.ocr{margin:10px 0 2px;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.ocr-msg{display:flex;align-items:center;gap:10px;font-size:14px}
.ocr.err .ocr-msg{color:var(--danger)}
.ocr-bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.ocr-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.ocr.err .ocr-bar,.ocr.done .ocr-bar{display:none}
.ocr.done .ocr-msg{color:var(--accent)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
.ocr.err .spin,.ocr.done .spin{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.form{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.fld{display:block;padding:8px 14px 6px;border-top:1px solid var(--line)}
.fld:first-child{border-top:0}
.fld>span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.fld input,.fld textarea{width:100%;border:0;outline:0;background:transparent;font-size:16.5px;padding:2px 0 4px;resize:none}
.fld textarea{min-height:64px}
.fld.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:var(--accent-soft)}100%{background:transparent}}
.pair{display:grid;grid-template-columns:1fr 34%;border-top:1px solid var(--line)}
.pair .fld{border-top:0}
.pair .fld+.fld{border-left:1px solid var(--line)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 6px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:5px 11px;font-size:13.5px;font-weight:600;text-align:left}
.chip small{opacity:.65;margin-left:5px;font-weight:500;font-size:12px}
.chip.undo{background:var(--surface2);color:var(--muted);border:1px solid var(--line);font-weight:500}
.matched{width:100%;font-size:12.5px;font-weight:600;color:var(--accent)}
.raw{margin-top:16px}
.raw summary{font-size:14px;font-weight:600;color:var(--muted);padding:6px 2px;cursor:pointer}
.raw-lines{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.raw-lines button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;text-align:left}
.raw-lines button:active{background:var(--accent-soft)}
.raw-note{font-size:13px;color:var(--muted);margin:2px 2px 4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s;z-index:50}
.scrim.on{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--sb) + 8px);z-index:51;transform:translateY(120%);transition:transform .22s ease;max-height:80vh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .opts{background:var(--surface);border-radius:14px;overflow:auto}
.sheet .ttl{white-space:pre-line;padding:12px 16px;text-align:center;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);word-break:break-word}
.sheet .opts button{display:block;width:100%;height:54px;font-size:18px;color:var(--accent);border-top:1px solid var(--line)}
.sheet .opts button:first-of-type{border-top:0}
.sheet .opts .ttl+button{border-top:0}
.sheet .opts button.danger{color:var(--danger)}
.sheet .cancel{margin-top:8px;background:var(--surface);border-radius:14px;height:56px;font-size:18px;font-weight:700;color:var(--accent);width:100%}

/* zoom */
.zoom{position:fixed;inset:0;background:#000;z-index:60;display:none;overflow:auto}
.zoom.on{display:block}
.zoom .inner{min-height:100%;display:flex;align-items:center;justify-content:center}
.zoom img{width:100%;display:block}
.zoom.big img{width:260%;max-width:none}
.zoom .x{position:fixed;top:calc(var(--st) + 10px);right:14px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-size:22px;z-index:2}
.zoom .zhint{position:fixed;bottom:calc(var(--sb) + 18px);left:0;right:0;text-align:center;color:#fff9;font-size:13px}

.crop-view{background:#111;color:#fff}
.crop-view .bar{background:#111;border-bottom-color:#222}
.crop-view .bar button{color:#45c3a7}
.c-hint{text-align:center;font-size:14px;color:#bbb;padding:8px 16px 0}
.c-stage{position:relative;flex:1;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.c-stage canvas#c-img{position:absolute}
.c-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#c-loupe{position:absolute;width:124px;height:124px;border-radius:62px;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.6);pointer-events:none;background:#000}
.c-tools{display:flex;gap:8px;padding:10px 16px calc(var(--sb) + 14px)}
.c-tools button{flex:1;height:52px;border-radius:12px;background:#222;color:#fff;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.c-tools button:active{background:#333}
.c-tools svg.i{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translate(-50%,20px);background:rgba(30,30,28,.92);color:#fff;
  padding:10px 18px;border-radius:22px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;z-index:70;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></symbol>
  <symbol id="ic-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>

  <symbol id="ic-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></symbol>
  <symbol id="ic-auto" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="m12 8 1.2 2.8L16 12l-2.8 1.2L12 16l-1.2-2.8L8 12l2.8-1.2z"/></symbol>

</svg>

<!-- ============ 列表 ============ -->
<section id="v-list" class="view active">
  <header class="top">
    <div class="top-row">
      <h1>名片夾<span id="count" class="count"></span></h1>
      <button class="icon-btn" id="btn-menu" aria-label="選單"><svg class="i"><use href="#ic-more"/></svg></button>
    </div>
    <label class="search">
      <svg class="i" style="width:19px;height:19px"><use href="#ic-search"/></svg>
      <input id="q" type="search" placeholder="搜尋姓名、公司、職稱、電話…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="q-clear" type="button" aria-label="清除" hidden><svg class="i" style="width:16px;height:16px"><use href="#ic-x"/></svg></button>
    </label>
    <div class="seg" id="seg">
      <button data-mode="all" class="on">全部名片</button>
      <button data-mode="company">依公司分類</button>
    </div>
  </header>
  <div class="scroll" id="list-scroll">
    <div id="hint" class="hint" hidden>
      <span>用 Safari 開啟時，點下方「分享」→「加入主畫面」，就能像 App 一樣從主畫面開啟。</span>
      <button id="hint-x">知道了</button>
    </div>
    <div id="crumb" class="crumb" hidden>
      <button id="crumb-back">‹ 所有公司</button><span id="crumb-title"></span>
    </div>
    <main id="list" class="list"></main>
  </div>
  <button id="fab" class="fab"><svg class="i"><use href="#ic-cam"/></svg>掃描名片</button>
</section>

<!-- ============ 名片內容 ============ -->
<section id="v-detail" class="view">
  <header class="bar">
    <button class="back" id="d-back"><svg class="i"><use href="#ic-back"/></svg>返回</button>
    <span class="bar-title"></span>
    <button class="right strong" id="d-edit">編輯</button>
  </header>
  <div class="scroll" id="detail"></div>
</section>

<!-- ============ 新增 / 編輯 ============ -->
<section id="v-edit" class="view">
  <header class="bar">
    <button class="back" id="e-cancel">取消</button>
    <span class="bar-title" id="e-title">新增名片</span>
    <button class="right strong" id="e-save">儲存</button>
  </header>
  <div class="scroll">
    <div class="e-wrap">
      <div class="seg sides" id="sides">
        <button data-side="front" class="on">正面</button>
        <button data-side="back">＋ 拍背面</button>
      </div>
      <div class="photo" id="e-photo"><img id="e-img" alt="" hidden><span id="e-noimg"></span></div>
      <div class="tools">

<script>
'use strict';
/* =====================================================================
   名片夾 — 名片掃描 PWA
   資料全部存在手機本機（IndexedDB），不會上傳到任何伺服器。
   文字辨識使用 Tesseract.js（在手機上執行）。
   ===================================================================== */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const icon = (id, st = '') => `<svg class="i" style="${st}"><use href="#${id}"/></svg>`;

const FIELDS = [
  { k: 'company', label: '公司名稱' },
  { k: 'name',    label: '姓名' },
  { k: 'title',   label: '職稱' },
  { k: 'dept',    label: '部門' },
  { k: 'phone',   label: '電話', type: 'tel', pair: 'ext' },
  { k: 'ext',     label: '分機', type: 'tel' },
  { k: 'mobile',  label: '手機', type: 'tel' },
  { k: 'fax',     label: '傳真', type: 'tel' },
  { k: 'email',   label: 'Email', type: 'email' },
  { k: 'address', label: '地址' },
  { k: 'website', label: '網址', type: 'url' },
  { k: 'notes',   label: '備註', multi: true, ph: '例如：在哪裡拿到、聊了什麼…' },
];

/* ============================ 名片文字解析 ============================ */
// PARSE-START
const CJK = '\\u3400-\\u9fff\\uf900-\\ufaff';
const SURNAMES = '陳林黃張李王吳劉蔡楊許鄭謝洪郭邱曾廖賴徐周葉蘇莊呂江何蕭羅高潘簡朱鍾游彭詹胡施沈余盧梁趙顏柯翁魏孫戴范方宋鄧杜傅侯曹薛丁卓阮馬董溫唐藍石蔣古紀姚連馮歐程湯田康姜白汪鄒尤巫鐘黎涂龔嚴韓袁金童陸夏柳凃邵錢伍倪于譚駱熊任甘秦顧毛章史官萬俞雷粘饒左包孔尹易賀殷艾單辜池車利麥龍葛';
const DOUBLE_SURNAMES = ['歐陽','司馬','諸葛','張簡','范姜','上官','司徒','東方','夏侯','皇甫','令狐','長孫'];
const TITLE_WORDS = '董事長|副董事長|總經理|副總經理|執行長|營運長|財務長|技術長|行銷長|總裁|副總裁|副總|協理|經理|副理|襄理|主任|主管|組長|課長|科長|處長|廠長|店長|院長|所長|會長|理事長|秘書長|秘書|特助|助理|專員|業務代表|業務|顧問|工程師|設計師|建築師|會計師|律師|代書|地政士|醫師|教授|講師|老師|負責人|總監|監事|董事|合夥人|創辦人|分析師|規劃師|管理師|督導|技師|專案|經紀人|仲介|營業員|護理長|護理師|藥師|營養師|治療師|心理師|社工師|校長|局長|站長|隊長|總幹事|幹事|研究員|記者|編輯|攝影師|主廚|技術員|領班|職員|PM|CEO|CFO|COO|CTO|CMO|President|Vice President|VP|Director|Manager|Engineer|Designer|Consultant|Specialist|Assistant|Sales|Founder|Owner|Partner|Supervisor|Officer|Executive|Representative|Agent|Architect|Accountant|Lawyer|Attorney';
const TITLE_RE = new RegExp('(' + TITLE_WORDS + ')', 'i');
const TITLE_START_RE = new RegExp('^(' + TITLE_WORDS + ')', 'i');
const PHONE_RE = /(?:\+?\s?886[\s\-.]?\(?0?\)?9\d{2}[\s\-.]?\d{3}[\s\-.]?\d{3}|\+?\s?886[\s\-.]?\(?0?\d{1,2}\)?[\s\-.]?\d{3,4}[\s\-.]?\d{3,4}|\(?0\d{1,3}\)?[\s\-.]?\d{3,4}[\s\-.]?\d{3,4}|09\d{2}[\s\-.]?\d{3}[\s\-.]?\d{3})/g;
const EXT_RE = /(?:分機|ext\.?|轉|#)\s*[:.]?\s*(\d{1,6})|(?:^|[^a-z])x\.?\s*(\d{2,6})/i;
const EMAIL_RE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)+/;
const WEB_RE = /(?:https?:\/\/|www\.)[^\s,，]+|\b[a-z0-9\-]+(?:\.[a-z0-9\-]+)*\.(?:com\.tw|org\.tw|net\.tw|gov\.tw|edu\.tw|idv\.tw|com|net|org|tw|biz|io|co)\b(?:\/[^\s]*)?/i;
const FAX_LBL = /傳真|fax|(?:^|[^a-z])F\s*[:.]/i;
const MOB_LBL = /手機|行動|mobile|cell|(?:^|[^a-z])M\s*[:.]/i;
const TEL_LBL = /電話|tel|phone|(?:^|[^a-z])[TP]\s*[:.]/i;
const LABEL_LONG = /^(公司名稱|公司|姓名|名字|職稱|職位|部門|電話|市話|手機|行動電話|行動|傳真|地址|住址|網址|網站|信箱|電子信箱|電子郵件|E-?mail|Tel|Phone|Mobile|Cell|Fax|Addr(?:ess)?|Add|Web(?:site)?|URL)\s*[:：.]?\s*/i;
const LABEL_SHORT = /^[TMFPEWA]\s*[:：.]\s*/i;

function cleanLine(s) {
  s = String(s || '')
    .replace(/[\uff01-\uff5e]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
    .replace(/\u3000/g, ' ').replace(/[|｜¦]/g, ' ').replace(/[“”"]/g, '')
    .replace(/\s+/g, ' ').trim();
  // Tesseract 常在中文字之間插入空白，把它們去掉
  s = s.replace(new RegExp(`([${CJK}])\\s+(?=[${CJK}])`, 'g'), '$1');
  s = s.replace(new RegExp(`([${CJK}])\\s+(?=[：:，、（(])`, 'g'), '$1');
  // 常見誤判：.com.tw 被讀成 .comiw / .com tw
  s = s.replace(/\.(com|org|net|gov|edu|idv)[\s.,]?[it1l|]w\b/gi, '.$1.tw');
  return s.replace(/^[\s\-_.,·•*~、。]+|[\s\-_,·•*~、]+$/g, '');
}
function stripLabel(s) { return s.replace(LABEL_LONG, '').replace(LABEL_SHORT, '').trim(); }
function isCJK(ch) { return new RegExp(`[${CJK}]`).test(ch); }
function cjkOnly(s) { return new RegExp(`^[${CJK}·．]+$`).test(s); }
function tidyPhone(s) { return s.replace(/\s+/g, ' ').replace(/\s*-\s*/g, '-').trim(); }

function companyScore(l) {
  if (EMAIL_RE.test(l)) return 0;
  const digits = (l.match(/\d/g) || []).length;
  if (digits >= 7) return 0;
  if (/股份有限公司|有限公司|有限責任/.test(l)) return 10;
  if (/(公司|企業社|工作室|事務所|銀行|集團|協會|基金會|醫院|診所|大學|學院|實業|商行|建設|開發|企業|聯合會|合作社|農會|代書|不動產|房屋|地產)$/.test(l)) return 8;
  if (/公司|企業社|工作室|事務所|銀行|集團|協會|基金會|醫院|診所|大學|不動產|房屋/.test(l)) return 6;
  if (/\b(Co\.?,?\s*Ltd\.?|Ltd\.?|Inc\.?|Corp\.?|Corporation|Company|LLC|Limited|Group|Studio)\b/i.test(l)) return 5;
  return 0;
}
function isAddress(l) {
  if (/^(地址|住址|Add|Addr|Address)\s*[:：]/i.test(l)) return true;
  if (new RegExp(`^\\d{3,6}\\s*[${CJK}]`).test(l) && /[市縣區路街號]/.test(l)) return true;
  const hits = (l.match(/[市縣區鄉鎮里村路街段巷弄號樓]/g) || []).length;
  if (hits >= 3) return true;
  if (/\d+\s*號/.test(l) && hits >= 2) return true;
  if (/\b(Rd|Road|St|Street|Sec|Dist|District|Ave|Avenue|Lane|Ln|Aly)\b\.?/i.test(l) && /\d/.test(l) && /(Taiwan|Taipei|Taichung|Kaohsiung|Tainan|Taoyuan|Hsinchu|City|R\.?O\.?C|No\.)/i.test(l)) return true;
  return false;
}
function isEnglishAddr(l) { return !new RegExp(`[${CJK}]`).test(l); }

function splitNameTitle(line) {
  // 例如「王小明業務經理」→ 王小明 / 業務經理
  if (!isCJK(line[0])) return null;
  const dbl = DOUBLE_SURNAMES.find(d => line.startsWith(d));
  const lens = dbl ? [3, 4] : (SURNAMES.includes(line[0]) ? [3, 2, 4] : []);
  for (const n of lens) {
    const name = line.slice(0, n), rest = line.slice(n).trim();
    if (!cjkOnly(name) || !rest) continue;
    if (TITLE_RE.test(name)) continue;
    if (TITLE_START_RE.test(rest) || new RegExp(`^[${CJK}]{0,6}(部|處|課|組|室|中心)`).test(rest) || /^[A-Za-z(（]/.test(rest)) return { name, title: rest };
  }
  if (lens.length) {
    const n = lens[0], name = line.slice(0, n), rest = line.slice(n).trim();
    if (cjkOnly(name) && TITLE_RE.test(rest)) return { name, title: rest };
  }
  return null;
}
function splitDeptTitle(t) {
  const m = t.match(new RegExp(`^(.+?(?:部|處|課|組|室|中心|分行|分公司))\\s*(.+)$`));
  if (m && TITLE_RE.test(m[2])) return { dept: m[1], title: m[2] };
  return null;
}

function parseCard(text) {
  const out = { company:'', name:'', title:'', dept:'', phone:'', ext:'', mobile:'', fax:'', email:'', address:'', website:'' };
  const rawLines = String(text || '').split(/\r?\n/).filter(r => cleanLine(r).length >= 2);
  const lines = rawLines.map(cleanLine);
  const used = new Set();

  // Email / 網址
  lines.forEach((l, i) => {
    const em = l.match(EMAIL_RE);
    if (em && !out.email) { out.email = em[0].replace(/[.,]+$/, ''); used.add(i); }
    const rest = em ? l.replace(em[0], ' ') : l;
    const wm = rest.match(WEB_RE);
    if (wm && !out.website && !/\d{4}/.test(wm[0])) { out.website = wm[0].replace(/[.,]+$/, ''); used.add(i); }
  });

  // 電話 / 手機 / 傳真 / 分機
  lines.forEach((l, i) => {
    const matches = [...l.matchAll(PHONE_RE)];
    if (!matches.length) return;
    let prev = 0, anyPhone = false;
    for (const m of matches) {
      const num = tidyPhone(m[0]);
      const digits = num.replace(/\D/g, '');
      if (digits.length < 8) { prev = m.index + m[0].length; continue; }
      const ctx = l.slice(prev, m.index);
      const lineCtx = matches.length === 1 ? l : ctx;
      let type;
      if (FAX_LBL.test(ctx)) type = 'fax';
      else if (MOB_LBL.test(ctx)) type = 'mobile';
      else if (TEL_LBL.test(ctx)) type = 'phone';
      else if (/^(?:\+?886)?0?9\d{8}$/.test(digits) || /^09/.test(digits)) type = 'mobile';
      else if (FAX_LBL.test(lineCtx)) type = 'fax';
      else type = 'phone';
      if (type === 'mobile' && !/^(?:886)?0?9/.test(digits)) type = 'phone';
      if (!out[type]) out[type] = num;
      prev = m.index + m[0].length;
      anyPhone = true;
      // 分機：緊接在號碼後面
      if (type === 'phone' && !out.ext) {
        const after = l.slice(prev, prev + 16);
        const em = after.match(EXT_RE);
        if (em) out.ext = em[1] || em[2];
      }
    }
    if (anyPhone) used.add(i);
  });
  if (!out.ext) {
    for (const l of lines) {
      if (FAX_LBL.test(l) && !TEL_LBL.test(l)) continue;
      const em = l.match(/(?:分機|ext\.?|轉)\s*[:.]?\s*(\d{1,6})/i);
      if (em) { out.ext = em[1]; break; }
    }
  }

  // 地址（中文優先）
  let addrIdx = -1;
  lines.forEach((l, i) => {
    if (used.has(i) || !isAddress(l)) return;
    if (addrIdx === -1 || (isEnglishAddr(lines[addrIdx]) && !isEnglishAddr(l))) addrIdx = i;
  });
  if (addrIdx >= 0) { out.address = stripLabel(lines[addrIdx]); used.add(addrIdx); }

  // 公司
  let best = -1, bestScore = 0;
  lines.forEach((l, i) => {
    if (used.has(i)) return;
    let s = companyScore(l);
    if (s && new RegExp(`[${CJK}]`).test(l)) s += 1;
    if (s > bestScore) { best = i; bestScore = s; }
  });
  if (best >= 0) { out.company = stripLabel(lines[best]); used.add(best); }

  // 職稱（以及可能在同一行的姓名、部門）
  let titleIdx = -1, titleLen = 99;
  lines.forEach((l, i) => {
    if (used.has(i) || l.length > 30) return;
    if (TITLE_RE.test(l) && l.length < titleLen) { titleIdx = i; titleLen = l.length; }
  });
  if (titleIdx >= 0) {
    let t = stripLabel(lines[titleIdx]);
    const sp = splitNameTitle(t.replace(/\s+/g, ''));
    const spaced = t.match(new RegExp(`^([${CJK}]{2,4})\\s+(.+)$`));
    if (spaced && TITLE_RE.test(spaced[2]) && !TITLE_RE.test(spaced[1]) && SURNAMES.includes(spaced[1][0])) { out.name = spaced[1]; t = spaced[2]; }
    else if (sp) { out.name = sp.name; t = sp.title; }
    const dt = splitDeptTitle(t);
    if (dt) { out.dept = dt.dept; t = dt.title; }
    out.title = t;
    used.add(titleIdx);
  }

  // 姓名
  if (!out.name) {
    let bestN = null, bestS = 0;
    lines.forEach((l, i) => {
      if (used.has(i)) return;
      let cand = null, s = 0;
      const c = l.replace(/[\s·．.]/g, '');
      const lead = l.match(new RegExp(`^([${CJK}]{2,4})\\s+[A-Za-z]`));
      if (cjkOnly(c) && c.length >= 2 && c.length <= 4) { cand = c; s = 3; }
      else if (lead) { cand = lead[1]; s = 3; }
      else if (/^[A-Z][a-zA-Z'\-]+(?:\s+[A-Z][a-zA-Z'\-.]+){1,2}$/.test(l) && !TITLE_RE.test(l) && !companyScore(l)) { cand = l; s = 1; }
      else {
        // 「陳志明 店長」這種：第一個詞是 2～4 個中文字的姓名，後面可能是辨識錯的職稱
        const tok = rawLines[i].trim().split(/\s+/)[0] || '';
        if (cjkOnly(tok) && tok.length >= 2 && tok.length <= 4 && c.length <= 10 && !isAddress(l)) { cand = tok; s = 1; }
      }
      if (!cand) return;
      if (TITLE_RE.test(cand) || companyScore(cand) || /[市縣區路街號樓部處課組]/.test(cand)) return;
      if (SURNAMES.includes(cand[0]) || DOUBLE_SURNAMES.some(d => cand.startsWith(d))) s += 4;
      if (cand.length === 3) s += 2;
      s -= i * 0.1;
      if (s > bestS) { bestS = s; bestN = { cand, i }; }
    });
    if (bestN) { out.name = bestN.cand; used.add(bestN.i); }
  }

  // 部門
  if (!out.dept) {
    lines.forEach((l, i) => {
      if (out.dept || used.has(i) || l.length > 20) return;
      if (new RegExp(`(部|處|課|組|中心|事業群|事業部|分行|門市)$`).test(l) || /\b(Department|Dept\.?|Division)\b/i.test(l)) { out.dept = stripLabel(l); used.add(i); }
    });
  }
  return out;
}
// PARSE-END

/* ============================ 資料庫 ============================ */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('cardbox', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('cards', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction('cards', mode);
      const r = fn(tx.objectStore('cards'));
      tx.oncomplete = () => res(r && r.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  all() { return this.req('readonly', s => s.getAll()); },
  put(c) { return this.req('readwrite', s => s.put(c)); },
  del(id) { return this.req('readwrite', s => s.delete(id)); },
};

/* ============================ 狀態 ============================ */
let cards = [];
const hay = new Map();
const urls = new Map();
let mode = 'all', companyFilter = null, currentId = null, edit = null, fileTarget = 'new';

const BLOB_KEYS = ['image', 'thumb', 'imageBack', 'imageOrig', 'imageBackOrig'];
const byId = id => cards.find(c => c.id === id);
const companyKey = c => nk(c.company) || '（未填公司）';
const NO_CO = '（未填公司）';
function companyLabel(list) { const m = new Map(); for (const c of list) { const v = (c.company || '').trim(); if (v) m.set(v, (m.get(v) || 0) + 1); } let b = NO_CO, n = 0; for (const [v, k] of m) if (k > n) { b = v; n = k; } return b; }
const norm = s => String(s || '').toLowerCase().replace(/[\s\-–—()（）.,，_]/g, '');
function index(c) {
  hay.set(c.id, norm(FIELDS.map(f => c[f.k]).concat(c.rawText || '', c.rawTextBack || '').join('|')));
}
function sortCards() { cards.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); }
function blobURL(c, kind) {
  const blob = c[kind]; if (!blob) return '';
  const key = c.id + ':' + kind, hit = urls.get(key);
  if (hit && hit.blob === blob) return hit.url;
  if (hit) URL.revokeObjectURL(hit.url);
  const url = URL.createObjectURL(blob);
  urls.set(key, { blob, url });
  return url;
}
function dropURLs(id) {
  for (const k of BLOB_KEYS) { const h = urls.get(id + ':' + k); if (h) { URL.revokeObjectURL(h.url); urls.delete(id + ':' + k); } }
}

/* ============================ 畫面切換 ============================ */
function show(name) {
  for (const v of ['list', 'detail', 'edit', 'crop']) $('#v-' + v).classList.toggle('active', v === name);
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
function sheet(title, opts) {
  const box = $('#sheet-opts');
  box.innerHTML = (title ? `<div class="ttl">${esc(title)}</div>` : '') +
    opts.map((o, i) => `<button data-i="${i}" class="${o.danger ? 'danger' : ''}">${esc(o.label)}</button>`).join('');
  box.onclick = e => { const b = e.target.closest('button'); if (!b) return; closeSheet(); opts[+b.dataset.i].fn(); };
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet() { $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').onclick = closeSheet; $('#sheet-cancel').onclick = closeSheet;

/* ============================ 列表 ============================ */
function rowHTML(c) {
  const th = c.thumb ? `<img src="${blobURL(c, 'thumb')}" alt="">` : icon('ic-card');
  const name = c.name || c.company || '（未命名）';
  const sub = c.name ? (c.company || '') : '';
  const tel = c.mobile || c.phone || c.email || '';
  return `<button class="row" data-id="${c.id}">
    <span class="thumb">${th}</span>
    <span class="row-main">
      <span class="row-name">${esc(name)}${c.title ? `<small>${esc(c.title)}</small>` : ''}</span>
      ${sub ? `<span class="row-sub">${esc(sub)}</span>` : ''}
      ${tel ? `<span class="row-sub">${esc(tel)}${c.phone && !c.mobile && c.ext ? ' #' + esc(c.ext) : ''}</span>` : ''}
    </span>
    <span class="chev">${icon('ic-chev', 'width:18px;height:18px')}</span></button>`;
}
function emptyHTML(title, msg) {
  return `<div class="empty"><div class="big">${icon('ic-card', 'width:40px;height:40px')}</div><b>${esc(title)}</b>${esc(msg)}</div>`;
}
function renderList() {
  const q = $('#q').value.trim();
  $('#q-clear').hidden = !q;
  $('#count').textContent = cards.length ? cards.length + ' 張' : '';
  const terms = q.split(/\s+/).map(norm).filter(Boolean);
  const showCrumb = !terms.length && mode === 'company' && companyFilter !== null;
  $('#crumb').hidden = !showCrumb;
  let html;
  if (!cards.length) {
    html = emptyHTML('還沒有任何名片', '點下方「掃描名片」，拍下第一張名片吧。');
  } else if (terms.length) {
    const res = cards.filter(c => { const h = hay.get(c.id) || ''; return terms.every(t => h.includes(t)); });
    html = res.length ? `<div class="raw-note" style="margin:0 4px 8px">找到 ${res.length} 張</div>` + res.map(rowHTML).join('')
                      : emptyHTML('找不到符合的名片', `沒有名片包含「${q}」`);
  } else if (mode === 'company' && companyFilter === null) {
    const groups = new Map();
    for (const c of cards) { const k = companyKey(c); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
    const keys = [...groups.keys()].sort((a, b) => (a === NO_CO) - (b === NO_CO) || companyLabel(groups.get(a)).localeCompare(companyLabel(groups.get(b)), 'zh-Hant-TW'));
    html = keys.map(k => {
      const list = groups.get(k), label = companyLabel(list);
      const names = list.map(c => c.name).filter(Boolean).slice(0, 3).join('、');
      return `<button class="row group" data-co="${esc(k)}">
        <span class="avatar">${esc([...label.replace(/^（/, '')][0] || '?')}</span>
        <span class="row-main"><span class="row-name">${esc(label)}</span>${names ? `<span class="row-sub">${esc(names)}${list.length > 3 ? '…' : ''}</span>` : ''}</span>
        <span class="badge">${list.length}</span></button>`;
    }).join('');
  } else {
    const list = mode === 'company' ? cards.filter(c => companyKey(c) === companyFilter) : cards;
    $('#crumb-title').textContent = mode === 'company' ? companyLabel(list) : '';
    html = list.map(rowHTML).join('');
  }
  $('#list').innerHTML = html;
}
$('#list').onclick = e => {
  const r = e.target.closest('.row'); if (!r) return;
  if (r.dataset.co !== undefined) { companyFilter = r.dataset.co; renderList(); $('#list-scroll').scrollTop = 0; }
  else openDetail(r.dataset.id);
};
$('#q').oninput = renderList;
$('#q').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
$('#q-clear').onclick = e => { e.preventDefault(); $('#q').value = ''; renderList(); $('#q').focus(); };
$('#seg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; companyFilter = null;
  for (const x of $('#seg').children) x.classList.toggle('on', x === b);
  renderList(); $('#list-scroll').scrollTop = 0;
};
$('#crumb-back').onclick = () => { companyFilter = null; renderList(); };

/* ============================ 名片內容 ============================ */
function telHref(num, ext) { return 'tel:' + String(num).replace(/[^\d+]/g, '') + (ext ? ',' + String(ext).replace(/\D/g, '') : ''); }
function webHref(u) { return /^https?:\/\//i.test(u) ? u : 'https://' + u; }
function fmtDate(t) { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; }

function openDetail(id) {
  const c = byId(id); if (!c) return;
  currentId = id;
  $('#v-detail .bar-title').textContent = c.name || c.company || '名片';
  const kv = (label, val, href) => val ? (href
    ? `<a class="kv" href="${esc(href)}"${/^https/.test(href) ? ' target="_blank" rel="noopener"' : ''}><div class="k">${label}</div><div class="v">${esc(val)}</div></a>`
    : `<div class="kv"><div class="k">${label}</div><div class="v">${esc(val)}</div></div>`) : '';
  const phoneShown = c.phone ? c.phone + (c.ext ? `  分機 ${c.ext}` : '') : (c.ext ? '分機 ' + c.ext : '');
  const quick = [
    c.phone && `<a href="${telHref(c.phone, c.ext)}">${icon('ic-phone')}電話</a>`,
    c.mobile && `<a href="${telHref(c.mobile)}">${icon('ic-mobile')}手機</a>`,
    c.email && `<a href="mailto:${esc(c.email)}">${icon('ic-mail')}Email</a>`,
    c.address && `<a href="https://maps.apple.com/?q=${encodeURIComponent(c.address)}" target="_blank" rel="noopener">${icon('ic-map')}地圖</a>`,
  ].filter(Boolean).join('');
  const info = [
    kv('公司名稱', c.company),
    kv('部門', c.dept),
    kv('電話', phoneShown, c.phone ? telHref(c.phone, c.ext) : ''),
    kv('手機', c.mobile, c.mobile ? telHref(c.mobile) : ''),
    kv('傳真', c.fax),
    kv('Email', c.email, c.email ? 'mailto:' + c.email : ''),
    kv('地址', c.address, c.address ? 'https://maps.apple.com/?q=' + encodeURIComponent(c.address) : ''),
    kv('網址', c.website, c.website ? webHref(c.website) : ''),
  ].join('');
  $('#detail').innerHTML = `<div class="d-wrap">
    <div class="d-photo" id="d-photo">${c.image || c.imageBack ? `<img src="${blobURL(c, c.image ? 'image' : 'imageBack')}" alt="名片照片">` : '沒有照片'}</div>
    ${c.image && c.imageBack ? `<div class="d-sides"><div class="seg" id="d-sides"><button class="on" data-k="image">正面</button><button data-k="imageBack">背面</button></div></div>` : ''}
    <div class="d-head">
      <h2>${esc(c.name || '（未填姓名）')}</h2>
      ${c.title || c.dept ? `<div class="t">${esc([c.dept, c.title].filter(Boolean).join(' · '))}</div>` : ''}
      ${c.company ? `<button class="co" id="d-co">${esc(c.company)}${icon('ic-chev', 'width:16px;height:16px')}</button>` : ''}
    </div>
    ${quick ? `<div class="quick">${quick}</div>` : ''}
    ${info ? `<div class="group-box">${info}</div>` : ''}
    ${c.notes ? `<div class="group-box">${kv('備註', c.notes)}</div>` : ''}
    <div class="meta">加入於 ${fmtDate(c.createdAt)}${c.updatedAt && c.updatedAt - c.createdAt > 60000 ? ' · 修改於 ' + fmtDate(c.updatedAt) : ''}</div>
    <button class="btn" id="d-vcf">${icon('ic-user')}加入手機通訊錄</button>
    <button class="btn danger" id="d-del">刪除這張名片</button>
  </div>`;
  $('#detail').scrollTop = 0;
  const img = $('#d-photo img'); if (img) img.onclick = () => openZoom(img.src);
  const ds = $('#d-sides'); if (ds) ds.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    for (const x of ds.children) x.classList.toggle('on', x === b);
    img.src = blobURL(c, b.dataset.k);
  };
  const co = $('#d-co'); if (co) co.onclick = () => {
    mode = 'company'; companyFilter = companyKey(c); $('#q').value = '';
    for (const x of $('#seg').children) x.classList.toggle('on', x.dataset.mode === 'company');
    renderList(); show('list'); $('#list-scroll').scrollTop = 0;
  };
  $('#d-vcf').onclick = () => saveVCard(c);
  $('#d-del').onclick = () => sheet('確定要刪除這張名片嗎？刪除後無法復原。', [{ label: '刪除名片', danger: true, fn: () => removeCard(c.id) }]);
  show('detail');
}
$('#d-back').onclick = () => { renderList(); show('list'); };
$('#d-edit').onclick = () => startEdit(currentId);

async function removeCard(id) {
  await DB.del(id);
  cards = cards.filter(c => c.id !== id); hay.delete(id); dropURLs(id);
  if (mode === 'company' && companyFilter !== null && !cards.some(c => companyKey(c) === companyFilter)) companyFilter = null;
  renderList(); show('list'); toast('已刪除');
}

function openZoom(src) { $('#zoom-img').src = src; $('#zoom').classList.remove('big'); $('#zoom').classList.add('on'); }
$('#zoom-img').onclick = () => $('#zoom').classList.toggle('big');
$('#zoom-x').onclick = () => $('#zoom').classList.remove('on');

(function bindCrop() {
  const st = $('#c-stage');
  const local = e => { const r = st.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  st.addEventListener('pointerdown', e => {
    if (!cropS.src) return;
    const [px, py] = local(e);
    let best = null, bd = 44;
    for (const hd of handles()) {
      const d = Math.hypot(hd.p[0] - px, hd.p[1] - py) - (hd.k === 'c' ? 8 : 0);
      if (d < bd) { bd = d; best = hd; }
    }
    if (!best) return;
    e.preventDefault(); st.setPointerCapture(e.pointerId);
    cropS.drag = { h: best, start: [px, py], q0: cropS.quad.map(p => p.slice()) };
  });
  st.addEventListener('pointermove', e => {
    const dg = cropS.drag; if (!dg) return;
    e.preventDefault();
    const [px, py] = local(e), dx = (px - dg.start[0]) / cropS.ds, dy = (py - dg.start[1]) / cropS.ds;
    const W = cropS.src.width, H = cropS.src.height, cl = (v, m) => Math.max(0, Math.min(m, v));
    const idx = dg.h.k === 'c' ? [dg.h.i] : [dg.h.i, (dg.h.i + 1) % 4];
    for (const i of idx) cropS.quad[i] = [cl(dg.q0[i][0] + dx, W), cl(dg.q0[i][1] + dy, H)];
    drawCrop();
    const focus = dg.h.k === 'c' ? cropS.quad[dg.h.i] : [(cropS.quad[idx[0]][0] + cropS.quad[idx[1]][0]) / 2, (cropS.quad[idx[0]][1] + cropS.quad[idx[1]][1]) / 2];
    const [fx, fy] = toScr(focus); drawLoupe(fx, fy, focus);
  });
  const end = () => { cropS.drag = null; $('#c-loupe').hidden = true; };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  window.addEventListener('resize', () => { if ($('#v-crop').classList.contains('active')) layoutCrop(); });
})();
$('#c-auto').onclick = () => { const r = detectCard(cropS.src); cropS.quad = r.quad; setCropHint(r.auto); drawCrop(); };
$('#c-full').onclick = () => { cropS.quad = fullQuad(cropS.src); setCropHint(null); drawCrop(); };
$('#c-rot').onclick = () => { const h = cropS.src.height; cropS.src = rotate90(cropS.src); cropS.quad = rotateQuad(cropS.quad, h); layoutCrop(); };
$('#c-cancel').onclick = () => { const f = cropS.cancel; cropS.src = null; f && f(); };
$('#c-done').onclick = () => {

/* ============================ 新增 / 編輯 ============================ */
function buildForm() {
  let h = '';
  for (const f of FIELDS) {
    if (f.k === 'ext') continue;
    const fld = x => `<label class="fld"><span>${x.label}</span>${x.multi
      ? `<textarea name="${x.k}" rows="3" placeholder="${esc(x.ph || '')}"></textarea>`
      : `<input name="${x.k}" type="${x.type || 'text'}" ${x.type === 'tel' ? 'inputmode="tel"' : ''} autocapitalize="off" autocorrect="off" spellcheck="false">`}${MATCH_FIELDS.includes(x.k) ? `<div class="sugg" id="sg-${x.k}" hidden></div>` : ''}</label>`;
    if (f.pair) h += `<div class="pair">${fld(f)}${fld(FIELDS.find(x => x.k === f.pair))}</div>`;
    else h += fld(f);
  }
  $('#e-form').innerHTML = h;
  $('#e-form').addEventListener('input', e => {
    const k = e.target.name;
    if (MATCH_FIELDS.includes(k)) renderSugg(k); else if (k === 'email') renderSugg('company');
  });
  $('#e-form').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    e.preventDefault();
    const k = b.dataset.k, inp = $('#e-form').elements[k];
    inp.value = b.dataset.v; edit.auto[k] = b.dataset.v;
    if (b.classList.contains('undo')) delete edit.matched[k]; else edit.matched[k] = b.dataset.v;
    flash(inp); renderSugg(k);
  });
}
function fillForm(c) { for (const f of FIELDS) $('#e-form').elements[f.k].value = c[f.k] || ''; }
function readForm() { const o = {}; for (const f of FIELDS) o[f.k] = $('#e-form').elements[f.k].value.trim(); return o; }
function showPhoto() {
  if (!edit) return;
  const sd = edit[edit.side], has = !!sd.canvas;
  for (const b of $('#sides').children) {
    b.classList.toggle('on', b.dataset.side === edit.side);
    if (b.dataset.side === 'back') b.textContent = edit.back.canvas ? '背面' : '＋ 拍背面';
  }
  $('#e-img').hidden = !has; $('#e-noimg').hidden = has;
  $('#e-photo').classList.toggle('empty', !has);
  if (has) $('#e-img').src = sd.canvas.toDataURL('image/jpeg', 0.85);

  setTools();
}
function renderRaw() {
  const items = [];
  for (const side of ['front', 'back']) {
    const ls = (edit[side].text || '').split('\n').map(cleanLine).filter(l => l.length >= 2);
    if (ls.length && edit.back.text && edit.front.text) items.push({ head: SIDE_NAME[side] });
    for (const l of ls) items.push({ line: l });
  }
  $('#raw').hidden = !items.length;
  $('#raw-lines').innerHTML = items.map((it, i) => it.head ? `<div class="raw-side">${it.head}</div>` : `<button type="button" data-i="${i}">${esc(it.line)}</button>`).join('');
  $('#raw-lines').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const line = items[+b.dataset.i].line;
    sheet(line, FIELDS.map(f => ({ label: '填入「' + f.label + '」', fn: () => fillFromLine(f.k, line) })));
  };
}
function fillFromLine(k, line) {
  let v = stripLabel(line);
  if (['phone', 'mobile', 'fax'].includes(k)) { const m = line.match(PHONE_RE); if (m) v = tidyPhone(m[0]); }
  if (k === 'ext') { const m = line.match(EXT_RE); v = m ? (m[1] || m[2]) : line.replace(/\D/g, ''); }
  if (k === 'email') { const m = line.match(EMAIL_RE); if (m) v = m[0]; }
  if (k === 'website') { const m = line.match(WEB_RE); if (m) v = m[0]; }
  const inp = $('#e-form').elements[k];
  if (k === 'notes' && inp.value.trim()) inp.value += '\n' + v; else inp.value = v;
  flash(inp);
  inp.closest('.fld').scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function openEditor(c, isNew) {
  ocrQueue.clear();
  const side = text => ({ canvas: null, orig: null, quad: null, ver: 0, text: text || '', changed: false });
  edit = { id: isNew ? null : c.id, isNew, side: 'front', front: side(c.rawText), back: side(c.rawTextBack), auto: {}, ocrOrig: {}, matched: {}, start: '' };
  $('#e-title').textContent = isNew ? '新增名片' : '編輯名片';
  fillForm(c); edit.start = JSON.stringify(readForm()); renderAllSugg();
  setOCR(null); renderRaw(); showPhoto();

}
async function startNew(file) {
  openEditor({}, true);
  await setPhoto(file, 'front');
}
async function startEdit(id) {
  const c = byId(id); if (!c) return;
  openEditor(c, false);
  const s = edit;
  for (const [side, key, okey, qkey] of [['front', 'image', 'imageOrig', 'quad'], ['back', 'imageBack', 'imageBackOrig', 'quadBack']]) {
    if (!c[key]) continue;
    const cv = await blobToCanvas(c[key]);
    const orig = c[okey] && c[qkey] ? await blobToCanvas(c[okey]) : null;
    if (edit !== s) return;
    const sd = edit[side];
    sd.canvas = cv; sd.orig = orig || cv; sd.quad = orig ? c[qkey] : fullQuad(cv);

  }
}
async function setPhoto(file, side) {
  const s = edit;
  let cv;
  try { cv = await blobToCanvas(file); }
  catch (e) { show('edit'); setOCR('這張照片無法讀取，請換一張。', null, 'err'); return; }
  if (edit !== s) return;
  // 拍完先進入「調整範圍」：自動框出名片，使用者可微調
  openCrop(cv, null, (src, quad) => applyCrop(side, src, quad), () => {

function applyCrop(side, src, quad) {

function pickPhoto() { fileTarget = edit.side; $('#file').value = ''; $('#file').click(); }
$('#fab').onclick = () => { fileTarget = 'new'; $('#file').value = ''; $('#file').click(); };
$('#e-retake').onclick = pickPhoto;

$('#file').onchange = e => {

  if (fileTarget === 'new') startNew(f); else if (edit) setPhoto(f, fileTarget);
};
$('#sides').onclick = e => {
  const b = e.target.closest('button'); if (!b || !edit) return;

  if (edit.side === 'back' && !edit.back.canvas) pickPhoto();
};
$('#e-rotate').onclick = () => {
  const sd = edit && edit[edit.side]; if (!sd || !sd.canvas) return;
  sd.canvas = rotate90(sd.canvas);
  if (sd.orig) { const h = sd.orig.height; sd.orig = rotate90(sd.orig); sd.quad = rotateQuad(sd.quad, h); }
  sd.ver++; sd.changed = true;
  showPhoto(); runOCR(edit.side);
};
$('#e-crop').onclick = () => {
  const side = edit && edit.side, sd = side && edit[side]; if (!sd || !sd.canvas) return;
  openCrop(sd.orig || sd.canvas, sd.quad || fullQuad(sd.orig || sd.canvas), (src, quad) => applyCrop(side, src, quad), () => show('edit'));
};
$('#e-reocr').onclick = () => runOCR(edit.side);
$('#e-remove').onclick = () => sheet('要移除背面照片嗎？', [{ label: '移除背面', danger: true, fn: () => {
  edit.back = { canvas: null, orig: null, quad: null, ver: edit.back.ver + 1, text: '', changed: true };
  ocrQueue.delete('back'); edit.side = 'front'; showPhoto(); renderRaw(); setOCR(null);
} }]);
$('#e-cancel').onclick = () => {
  const dirty = JSON.stringify(readForm()) !== edit.start || edit.front.changed || edit.back.changed;
  if (dirty) sheet(edit.isNew ? '要放棄這張名片嗎？' : '要放棄這次的修改嗎？', [{ label: '放棄', danger: true, fn: leaveEditor }]);
  else leaveEditor();
};
$('#e-save').onclick = async () => {
  const data = readForm();
  if (!edit.front.canvas && !edit.back.canvas && !Object.values(data).some(Boolean)) { toast('請拍一張照片或至少填寫一個欄位'); return; }
  const btn = $('#e-save'); btn.disabled = true;
  try {
    const now = Date.now(), old = edit.id ? byId(edit.id) : null;
    const rec = Object.assign({}, old || {}, data, {
      id: edit.id || uid(), rawText: edit.front.text || '', rawTextBack: edit.back.text || '',
      createdAt: old ? old.createdAt : now, updatedAt: now,
    });
    const thumbSrc = edit.front.canvas || edit.back.canvas;
    // 儲存裁切後的名片，以及原始照片＋紅框位置（之後可以再「調整範圍」）
    for (const [side, key, okey, qkey] of [['front', 'image', 'imageOrig', 'quad'], ['back', 'imageBack', 'imageBackOrig', 'quadBack']]) {
      const sd = edit[side]; if (!sd.changed) continue;
      if (!sd.canvas) { rec[key] = rec[okey] = rec[qkey] = null; continue; }
      rec[key] = await canvasBlob(fit(sd.canvas, 1400), 0.82);
      if (sd.orig && sd.quad) {
        const o = fit(sd.orig, 1600), f = o.width / sd.orig.width;
        rec[okey] = await canvasBlob(o, 0.8); rec[qkey] = sd.quad.map(([x, y]) => [x * f, y * f]);

    }

    if (!thumbSrc) rec.thumb = null;

    cards = cards.filter(c => c.id !== rec.id); cards.push(rec); sortCards(); index(rec);
    const wasNew = edit.isNew; edit = null; ocrQueue.clear(); setOCR(null);
    renderList(); openDetail(rec.id); toast(wasNew ? '名片已儲存' : '已更新');

  } finally { btn.disabled = false; }

/* ============================ 通訊錄 / 備份 ============================ */
function vEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function splitName(n) {
  n = (n || '').trim();
  if (!n) return ['', ''];
  if (cjkOnly(n)) { const d = DOUBLE_SURNAMES.find(x => n.startsWith(x)) && n.length > 2 ? 2 : 1; return [n.slice(0, d), n.slice(d)]; }
  const p = n.split(/\s+/); return p.length > 1 ? [p.pop(), p.join(' ')] : [n, ''];
}
// 注意：iPhone 只允許「使用者點按後立刻」呼叫分享，所以這個函式必須在點按當下直接呼叫，前面不能有 await
async function share(blob, name, retry) {
  let file = null;
  if (navigator.canShare) {
    for (const type of [blob.type, 'text/plain', 'application/octet-stream']) {
      const f = new File([blob], name, { type });
      if (navigator.canShare({ files: [f] })) { file = f; break; }
    }
  }
  if (file) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) {
      if (e.name === 'AbortError') return;
      if (e.name === 'NotAllowedError' && !retry) {
        sheet('檔案已準備好', [{ label: '儲存或分享 ' + name, fn: () => share(blob, name, true) }]);
        return;
      }
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function saveVCard(c) {
  const [fam, giv] = splitName(c.name);
  const L = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(fam)};${vEsc(giv)};;;`, `FN:${vEsc(c.name || c.company || '名片')}`];
  if (c.company || c.dept) L.push(`ORG:${vEsc(c.company)}${c.dept ? ';' + vEsc(c.dept) : ''}`);
  if (c.title) L.push(`TITLE:${vEsc(c.title)}`);
  if (c.phone) L.push(`TEL;TYPE=WORK,VOICE:${c.phone.replace(/[^\d+\-]/g, '')}${c.ext ? ',' + c.ext : ''}`);
  if (c.mobile) L.push(`TEL;TYPE=CELL:${c.mobile.replace(/[^\d+\-]/g, '')}`);
  if (c.fax) L.push(`TEL;TYPE=WORK,FAX:${c.fax.replace(/[^\d+\-]/g, '')}`);
  if (c.email) L.push(`EMAIL;TYPE=WORK:${c.email}`);
  if (c.address) L.push(`ADR;TYPE=WORK:;;${vEsc(c.address)};;;;`);
  if (c.website) L.push(`URL:${c.website}`);
  if (c.notes) L.push(`NOTE:${vEsc(c.notes)}`);
  L.push('END:VCARD');
  const blob = new Blob([L.join('\r\n') + '\r\n'], { type: 'text/vcard;charset=utf-8' });
  // iPhone 打開 .vcf 會直接顯示「建立新聯絡人」
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.target = '_blank'; a.rel = 'noopener';
  a.download = (c.name || 'contact') + '.vcf';
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) a.removeAttribute('download');
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
}
function blobToDataURL(b) { return new Promise(r => { if (!b) return r(null); const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); }
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`; }
async function exportJSON() {
  if (!cards.length) return toast('目前沒有名片可以備份');
  toast('準備備份檔…');
  const out = [];
  for (const c of cards) { const o = Object.assign({}, c); for (const k of BLOB_KEYS) o[k] = await blobToDataURL(c[k]); out.push(o); }
  const blob = new Blob([JSON.stringify({ app: 'cardbox', version: 1, exportedAt: new Date().toISOString(), cards: out })], { type: 'application/json' });
  const name = `名片備份-${stamp()}.json`, mb = (blob.size / 1048576).toFixed(1);
  // 打包照片需要時間，iPhone 會擋掉延遲的分享，所以打包好後再讓使用者點一次
  sheet(`備份檔已準備好：${cards.length} 張名片（${mb} MB）\n點下方按鈕後，選「儲存到檔案」`, [{ label: '儲存或分享備份檔', fn: () => share(blob, name) }]);
}
async function exportCSV() {
  if (!cards.length) return toast('目前沒有名片可以匯出');
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = FIELDS.map(f => f.label).concat('加入日期');
  const rows = cards.map(c => FIELDS.map(f => q(c[f.k])).concat(q(fmtDate(c.createdAt))).join(','));
  const blob = new Blob(['\ufeff' + head.map(q).join(',') + '\r\n' + rows.join('\r\n')], { type: 'text/csv' });
  await share(blob, `名片清單-${stamp()}.csv`);
}
async function importJSON(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.cards)) throw new Error('format');
    let n = 0;
    for (const raw of data.cards) {
      if (!raw || !raw.id) continue;
      const c = Object.assign({}, raw);
      for (const k of BLOB_KEYS) c[k] = raw[k] ? await (await fetch(raw[k])).blob() : null;
      await DB.put(c);
      cards = cards.filter(x => x.id !== c.id); cards.push(c); index(c); n++;
    }
    sortCards(); renderList(); toast(`已匯入 ${n} 張名片`);
  } catch (e) { console.error(e); toast('這不是有效的名片備份檔'); }
}
$('#import-file').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };
$('#btn-menu').onclick = () => sheet('名片都只存在這支手機裡，建議定期匯出備份。', [
  { label: '匯出備份檔（含照片）', fn: exportJSON },
  { label: '匯入備份檔', fn: () => $('#import-file').click() },
  { label: '匯出 Excel 清單（CSV）', fn: exportCSV },
]);

/* ============================ 啟動 ============================ */
(async function init() {
  buildForm();
  try { await DB.open(); cards = await DB.all(); } catch (e) { console.error(e); toast('無法開啟資料庫'); }
  cards.forEach(index); sortCards(); renderList();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let dismissed = false; try { dismissed = localStorage.getItem('hint-x') === '1'; } catch (e) {}
  if (ios && navigator.standalone === false && !dismissed) $('#hint').hidden = false;
  $('#hint-x').onclick = () => { $('#hint').hidden = true; try { localStorage.setItem('hint-x', '1'); } catch (e) {} };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
